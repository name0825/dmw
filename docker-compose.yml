version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dmw-server
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 3001
      WS_PORT: 3002
      BIND_HOST: 127.0.0.1
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file at the project root before running docker compose}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dmw.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in a .env file at the project root before running docker compose}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_DEV_PORT:-5173},http://127.0.0.1:${WEB_DEV_PORT:-5173}}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      WOL_BROADCAST_ADDRESS: ${WOL_BROADCAST_ADDRESS:-}
      SSH_KEY_PATH: ${SSH_KEY_PATH:-/app/data/ssh/dmw_ed25519}
    volumes:
      - dmw_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_WS_BASE: ${VITE_WS_BASE:-}
        SERVER_PORT: ${SERVER_PORT:-3001}
        WS_PORT: ${WS_PORT:-3002}
    container_name: dmw-web
    restart: unless-stopped
    network_mode: host
    environment:
      WEB_DEV_PORT: ${WEB_DEV_PORT:-5173}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${WEB_DEV_PORT:-5173}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dmw_data:
