version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dmw-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: change-me-in-production
      ADMIN_EMAIL: admin@dmw.local
      ADMIN_PASSWORD: change-this-password
      DB_PATH: /app/data/dmw.db
      ALERT_CPU_THRESHOLD: 85
      ALERT_MEMORY_THRESHOLD: 80
      ALERT_DISK_THRESHOLD: 90
    volumes:
      - dmw_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dmw-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dmw_data:
