name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace server test
      - run: npx tsc --noEmit -p web/tsconfig.json
      - run: npm --workspace web run build
      - run: node --test agent/test/*.test.js
